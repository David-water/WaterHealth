name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source and website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make check
      - name: Reproduce checked-in Xcode project
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- ios/WaterHealth.xcodeproj
  native:
    name: Native builds and business tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode and available simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Business tests on an installed iPhone simulator
        run: make test
      - name: Universal native Mac Release
        run: make mac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-test-results
          path: .build/test-results/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
